name: Kernel Builder

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4

    - name: Clone LineageOS kernel source
      run: |
        git clone --depth=1 --branch=lineage-22.2 https://github.com/LineageOS/android_kernel_nothing_sm7325.git kernel-source
        cd kernel-source
        git submodule update --init --recursive --depth=1

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
        echo "PROTON_CLANG=$(pwd)/proton-clang" >> $GITHUB_ENV
        echo "PATH=$(pwd)/proton-clang/bin:$PATH" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          gcc-multilib \
          git \
          gnupg \
          gperf \
          liblz4-tool \
          libncurses5-dev \
          libssl-dev \
          libxml2-utils \
          lzop \
          m4 \
          make \
          python3 \
          rsync \
          unzip \
          zip \
          zlib1g-dev

    - name: Set up ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}-
          ${{ runner.os }}-ccache-

    - name: Build kernel
      working-directory: ./kernel-source
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Set compiler paths
        export CC=clang
        export CLANG_PATH=$PROTON_CLANG/bin
        export PATH=$CLANG_PATH:$PATH
        
        # Create out directory
        mkdir -p out
        
        # Make defconfig
        make O=out vendor/lahaina-qgki_defconfig
        
        # Build kernel with full LLVM toolchain
        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CFLAGS="-O2 -pipe -Wno-error=implicit-function-declaration" \
          CXXFLAGS="-O2 -pipe"
        
        # Verify the build
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "Kernel built successfully!"
          # Create artifacts directory
          mkdir -p ../artifacts
          # Copy the built image
          cp out/arch/arm64/boot/Image.gz-dtb ../artifacts/
          # Create zip archive
          cd ../artifacts
          zip -r9 kernel-$(date +%Y%m%d-%H%M).zip *
        else
          echo "Kernel build failed!"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build
        path: artifacts/*.zip
        if-no-files-found: error
