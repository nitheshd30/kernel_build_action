name: Nothing Phone (1) Kernel Build (Proton Clang)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    # 1. Checkout this repository
    - uses: actions/checkout@v4

    # 2. Clone NothingOS kernel
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 --branch=sm7325/v/mr \
        https://github.com/NothingOSS/android_kernel_msm-5.4_nothing_sm7325.git kernel

    # 3. Install dependencies
    - name: Install Build Tools
      run: |
        sudo apt update -y
        sudo apt install -y git ccache bc libncurses5-dev \
        build-essential flex bison libelf-dev libssl-dev python3

    # 4. Download Proton Clang (Latest Stable)
    - name: Setup Proton Clang
      run: |
        git clone --depth=1 \
        https://github.com/kdrag0n/proton-clang.git clang

    # 5. Configure for GKI
    - name: Configure Kernel
      run: |
        cd kernel
        make ARCH=arm64 O=out gki_defconfig
        make ARCH=arm64 O=out olddefconfig

    # 6. Build with Proton Clang
    - name: Compile Kernel
      run: |
        cd kernel
        make ARCH=arm64 O=out -j$(nproc) \
        CC=clang/bin \
        LD=clang/bin/ld.lld \
        AR=clang/bin/llvm-ar \
        NM=clang/bin/llvm-nm \
        STRIP=clang/bin/llvm-strip \
        OBJCOPY=clang/bin/llvm-objcopy \
        OBJDUMP=clang/bin/llvm-objdump \
        CROSS_COMPILE=aarch64-linux-gnu- \
        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
        LLVM=1 LLVM_IAS=1

    # 7. Package artifacts
    - name: Prepare Output
      run: |
        mkdir -p artifacts
        cp kernel/out/arch/arm64/boot/{Image.gz,Image.gz-dtb} artifacts/
        [ -f kernel/out/vendor_boot.img ] && cp kernel/out/vendor_boot.img artifacts/

    # 8. Upload results
    - uses: actions/upload-artifact@v4
      with:
        name: nothing-kernel-proton
        path: artifacts/*
