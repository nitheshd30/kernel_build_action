name: Kernel Build - Nothing Phone 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/NothingOSS/android_kernel_msm-5.4_nothing_sm7325 -b sm7325/v/mr kernel

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget curl build-essential bc bison flex libssl-dev libncurses-dev

    - name: Clone Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

    - name: Build Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH=$(pwd)/../clang
        export PATH=$CLANG_PATH/bin:$PATH

        make O=out ARCH=arm64 vendor/lahaina_GKI.config
        make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

    - name: Prepare Flashable Zip
      run: |
        cp kernel/out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../NothingPhone1-Kernel.zip * -x .git README.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "auto-release-${{ github.run_number }}"
        name: "Nothing Phone 1 Kernel - Build ${{ github.run_number }}"
        body: |
          Automatic kernel build for Nothing Phone 1.
          - Config: vendor/lahaina_GKI.config
          - Build number: ${{ github.run_number }}
          - Triggered by: ${{ github.actor }}
        files: NothingPhone1-Kernel.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
