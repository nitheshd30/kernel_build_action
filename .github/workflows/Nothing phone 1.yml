name: Nothing Phone (1) Kernel Build (LineageOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    # 1. Checkout this repository
    - uses: actions/checkout@v4

    # 2. Clone LineageOS kernel (Android 13 base)
    - name: Clone Kernel Source
      run: |
        git clone --depth=1 --branch=lineage-22.2 \
        https://github.com/LineageOS/android_kernel_nothing_sm7325.git kernel

    # 3. Install dependencies
    - name: Install Build Tools
      run: |
        sudo apt update -y
        sudo apt install -y git ccache bc libncurses5-dev \
        build-essential flex bison libelf-dev libssl-dev python3

    # 4. Download correct Clang (Android 13 compatible)
    - name: Setup Toolchain
      run: |
        git clone --depth=1 \
        https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b \
        clang

    # 5. Configure kernel with lahaina-qgki_defconfig
    - name: Configure Kernel
      run: |
        cd kernel
        make ARCH=arm64 O=out lahaina-qgki_defconfig
        make ARCH=arm64 O=out olddefconfig

    # 6. Build with explicit paths
    - name: Compile Kernel
      run: |
        cd kernel
        make ARCH=arm64 O=out -j$(nproc) \
        CC=$(pwd)/../clang/bin/clang \
        LD=$(pwd)/../clang/bin/ld.lld \
        AR=$(pwd)/../clang/bin/llvm-ar \
        CROSS_COMPILE=aarch64-linux-android- \
        LLVM=1 LLVM_IAS=1

    # 7. Package artifacts
    - name: Prepare Output
      run: |
        mkdir -p artifacts
        cp kernel/out/arch/arm64/boot/Image.gz-dtb artifacts/
        [ -f kernel/out/vendor_boot.img ] && cp kernel/out/vendor_boot.img artifacts/

    # 8. Upload results
    - uses: actions/upload-artifact@v4
      with:
        name: nothing-kernel-lineage
        path: artifacts/*
